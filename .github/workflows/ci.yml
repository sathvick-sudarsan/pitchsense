name: CI

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync ruff format --check src/pitchsense tests/pitchsense
      - run: uv run --no-sync ruff check src/pitchsense tests/pitchsense
      - run: uv run --no-sync pytest tests/pitchsense -q
